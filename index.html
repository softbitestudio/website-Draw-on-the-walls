<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { background: #06060a; color: #e0e0e0; font-family: 'Space Grotesk', sans-serif; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ff00ff44; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #ff00ff88; }

    /* Glow Effects — RIDICULOUS AMOUNT */
    .glow-cyan { text-shadow: 0 0 7px #00ffff, 0 0 20px #00ffff66, 0 0 40px #00ffff33, 0 0 80px #00ffff11; }
    .glow-mag { text-shadow: 0 0 7px #ff00ff, 0 0 20px #ff00ff66, 0 0 40px #ff00ff33, 0 0 80px #ff00ff11; }
    .glow-yel { text-shadow: 0 0 7px #ffff00, 0 0 20px #ffff0066, 0 0 40px #ffff0033, 0 0 80px #ffff0011; }
    .glow-lav { text-shadow: 0 0 7px #b388eb, 0 0 20px #b388eb66, 0 0 40px #b388eb33; }

    .box-glow-cyan { box-shadow: 0 0 10px #00ffff33, 0 0 30px #00ffff15, 0 0 60px #00ffff08; }
    .box-glow-mag { box-shadow: 0 0 10px #ff00ff33, 0 0 30px #ff00ff15, 0 0 60px #ff00ff08; }
    .box-glow-yel { box-shadow: 0 0 10px #ffff0033, 0 0 30px #ffff0015, 0 0 60px #ffff0008; }
    .box-glow-lav { box-shadow: 0 0 10px #b388eb33, 0 0 30px #b388eb15, 0 0 60px #b388eb08; }

    .border-glow-cyan { border-color: #00ffff44; box-shadow: 0 0 5px #00ffff33, inset 0 0 5px #00ffff08; }
    .border-glow-mag { border-color: #ff00ff44; box-shadow: 0 0 5px #ff00ff33, inset 0 0 5px #ff00ff08; }

    /* Noise */
    .noise::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    /* Grid BG */
    .grid-bg {
      background-image:
        linear-gradient(rgba(0,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Panel styling */
    .panel {
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .panel:hover {
      border-color: rgba(0,255,255,0.12);
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }
    .panel-header:hover { background: rgba(255,255,255,0.02); }
    .panel-body {
      padding: 14px;
      max-height: 800px;
      overflow-y: auto;
      transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), padding 0.3s, opacity 0.3s;
      opacity: 1;
    }
    .panel.collapsed .panel-body {
      max-height: 0;
      padding: 0 14px;
      opacity: 0;
      overflow: hidden;
    }
    .panel.collapsed .panel-chevron { transform: rotate(-90deg); }
    .panel-chevron { transition: transform 0.3s ease; }

    /* Tab system */
    .tab-btn {
      position: relative;
      padding: 6px 14px;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      border-radius: 6px;
      transition: all 0.25s ease;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn:hover { color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.03); }
    .tab-btn.active {
      color: #00ffff;
      background: rgba(0,255,255,0.08);
      box-shadow: 0 0 15px rgba(0,255,255,0.15), inset 0 0 15px rgba(0,255,255,0.05);
    }
    .tab-btn.active .tab-dot { opacity: 1; }
    .tab-dot {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #00ffff;
      margin-right: 6px;
      opacity: 0;
      transition: opacity 0.25s;
      box-shadow: 0 0 6px #00ffff;
    }

    /* Drawing overlay */
    #drawOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 100;
      pointer-events: none;
      cursor: crosshair;
    }
    #drawOverlay.active {
      pointer-events: all;
    }

    /* Draw toolbar */
    .draw-toolbar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      z-index: 101;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(10,10,15,0.92);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,0,255,0.3);
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(255,0,255,0.2), 0 0 60px rgba(255,0,255,0.08), 0 8px 32px rgba(0,0,0,0.5);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .draw-toolbar.active {
      transform: translateX(-50%) translateY(0);
    }
    .draw-toolbar .color-swatch {
      width: 28px; height: 28px;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.15);
      cursor: pointer;
      transition: all 0.2s;
    }
    .draw-toolbar .color-swatch:hover { transform: scale(1.15); }
    .draw-toolbar .color-swatch.active { border-color: white; box-shadow: 0 0 10px currentColor; transform: scale(1.1); }

    /* Floating animation */
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .float { animation: float 4s ease-in-out infinite; }

    /* Pulse glow */
    @keyframes pulseGlow { 0%,100%{opacity:1;filter:brightness(1)} 50%{opacity:0.85;filter:brightness(1.3)} }
    .pulse-glow { animation: pulseGlow 3s ease-in-out infinite; }

    /* Marquee */
    @keyframes marquee { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
    .marquee { animation: marquee 20s linear infinite; }

    /* Status dot pulse */
    @keyframes dotPulse { 0%,100%{box-shadow:0 0 4px currentColor} 50%{box-shadow:0 0 12px currentColor, 0 0 24px currentColor} }
    .dot-pulse { animation: dotPulse 2s ease-in-out infinite; }

    /* Gallery card */
    .gallery-card {
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.04);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .gallery-card:hover {
      transform: translateY(-2px);
      border-color: rgba(0,255,255,0.2);
      box-shadow: 0 0 20px rgba(0,255,255,0.1), 0 8px 24px rgba(0,0,0,0.4);
    }
    .gallery-card img {
      width: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .gallery-card:hover img { transform: scale(1.06); }
    .gallery-card .overlay {
      pos
        ition: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(6,6,10,0.85) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.3s;
      display: flex;
      align-items: flex-end;
      padding: 12px;
    }
    .gallery-card:hover .overlay { opacity: 1; }

    /* CTA button */
    .cta-btn {
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .cta-btn::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 0; height: 0;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.5s ease, height 0.5s ease;
    }
    .cta-btn:hover::before { width: 300px; height: 300px; }

    /* Tag pill */
    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border: 1px solid;
      border-radius: 9999px;
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: all 0.25s ease;
    }

    /* Divider */
    .divider-neon {
      height: 1px;
      background: linear-gradient(90deg, transparent, #ff00ff44, #00ffff44, #ff00ff44, transparent);
    }

    /* Modal */
    .modal-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    /* Draw mode indicator */
    .draw-mode-badge {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(-40px);
      z-index: 102;
      padding: 6px 20px;
      background: rgba(255,0,255,0.15);
      border: 1px solid #ff00ff;
      border-radius: 9999px;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: #ff00ff;
      box-shadow: 0 0 20px rgba(255,0,255,0.3), 0 0 60px rgba(255,0,255,0.1);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      text-shadow: 0 0 8px #ff00ff;
    }
    .draw-mode-badge.active {
      transform: translateX(-50%) translateY(0);
    }

    /* Main layout */
    .app-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .app-toolbar {
      height: 48px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(6,6,10,0.9);
      backdrop-filter: blur(16px);
    }
    .app-content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .sidebar {
      width: 320px;
      flex-shrink: 0;
      border-right: 1px solid rgba(255,255,255,0.06);
      background: rgba(8,8,12,0.6);
      overflow-y: auto;
      overflow-x: hidden;
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), min-width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sidebar.collapsed {
      width: 0;
      min-width: 0;
      border-right: none;
    }
    .main-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 48px;
        left: 0;
        bottom: 0;
        z-index: 50;
        width: 280px;
        transform: translateX(-100%);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .sidebar.open {
        transform: translateX(0);
        box-shadow: 10px 0 40px rgba(0,0,0,0.5);
      }
      .sidebar.collapsed {
        transform: translateX(-100%);
      }
      .sidebar-backdrop {
        position: fixed;
        inset: 0;
        top: 48px;
        background: rgba(0,0,0,0.5);
        z-index: 49;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .sidebar-backdrop.open {
        opacity: 1;
        pointer-events: all;
      }
    }

    /* Scanline */
    @keyframes scanline { 0%{top:-10%} 100%{top:110%} }
    .scanline::after {
      content: '';
      position: absolute;
      left: 0; width: 100%; height: 1px;
      background: linear-gradient(90deg, transparent, #00ffff22, transparent);
      animation: scanline 4s linear infinite;
    }

    /* Color cycling border */
    @keyframes borderCycle {
      0% { border-color: #00ffff33; box-shadow: 0 0 10px #00ffff11; }
      33% { border-color: #ff00ff33; box-shadow: 0 0 10px #ff00ff11; }
      66% { border-color: #b388eb33; box-shadow: 0 0 10px #b388eb11; }
      100% { border-color: #00ffff33; box-shadow: 0 0 10px #00ffff11; }
    }
    .cycle-border { animation: borderCycle 6s ease infinite; }
  </style>
</head>
      <!-- Right actions -->
      <div class="flex items-center gap-1.5 ml-auto flex-shrink-0">
        <!-- Draw toggle -->
        <button id="drawToggle" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-mag-glow/30 text-mag-glow/70 hover:text-mag-glow hover:border-mag-glow/60 hover:bg-mag-glow/5 transition-all font-orbit text-[10px] tracking-wider">
          <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">DRAW</span>
        </button>
      </div>
    </div>
                  
                  <!-- ===== DRAW OVERLAY CANVAS ===== -->
  <canvas id="drawOverlay"></canvas>

  <!-- Draw mode badge -->
  <div id="drawModeBadge" class="draw-mode-badge">✦ DRAW MODE — esc to quit ✦</div>

  <!-- Draw toolbar -->
  <div id="drawToolbar" class="draw-toolbar">
    <div class="flex items-center gap-1">
      <div class="color-swatch active" style="background:#00ffff" data-color="#00ffff"></div>
      <div class="color-swatch" style="background:#ff00ff" data-color="#ff00ff"></div>
      <div class="color-swatch" style="background:#b388eb" data-color="#b388eb"></div>
      <div class="color-swatch" style="background:#ffff00" data-color="#ffff00"></div>
      <div class="color-swatch" style="background:#ffffff" data-color="#ffffff"></div>
    </div>
    <div class="w-px h-6 bg-white/10"></div>
    <div class="flex items-center gap-1.5 px-1">
      <i data-lucide="circle" class="w-2 h-2 text-gray-500"></i>
      <input type="range" id="brushSize" min="1" max="25" value="3" class="w-16 accent-mag-glow" style="height:3px">
      <i data-lucide="circle" class="w-4 h-4 text-gray-500"></i>
    </div>
    <div class="w-px h-6 bg-white/10"></div>
    <button id="clearCanvas" class="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-mag-glow/10 border border-mag-glow/20 text-mag-glow font-orbit text-[9px] tracking-wider hover:bg-mag-glow/20 transition-all">
      <i data-lucide="trash-2" class="w-3 h-3"></i> CLEAR
    </button>
    <div class="w-px h-6 bg-white/10"></div>
    <button id="drawClose" class="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-white/5 border border-white/10 text-gray-500 font-orbit text-[9px] tracking-wider hover:text-white hover:border-white/20 transition-all">
      <i data-lucide="x" class="w-3 h-3"></i> EXIT
    </button>
  </div>
  <!-- ===== SCRIPT ===== -->
  <script>
    // Init Lucide
    lucide.createIcons();

    // ===== TAB SYSTEM =====
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        tabBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        tabContents.forEach(tc => {
          tc.classList.remove('active');
          tc.style.display = 'none';
        });
        const target = document.getElementById('tab-' + tab);
        if (target) {
          target.classList.add('active');
          target.style.display = '';
        }
      });
    });

    // ===== SIDEBAR TOGGLE =====
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebarBackdrop = document.getElementById('sidebarBackdrop');
    let sidebarOpen = true;

    // On mobile, start collapsed
    if (window.innerWidth < 768) {
      sidebarOpen = false;
    }

    function updateSidebar() {
      if (window.innerWidth < 768) {
        sidebar.classList.toggle('open', sidebarOpen);
        sidebarBackdrop.classList.toggle('open', sidebarOpen);
      } else {
        sidebar.classList.toggle('collapsed', !sidebarOpen);
      }
    }

    sidebarToggle.addEventListener('click', () => {
      sidebarOpen = !sidebarOpen;
      updateSidebar();
    });

    sidebarBackdrop.addEventListener('click', () => {
      sidebarOpen = false;
      updateSidebar();
    });

    // ===== COLLAPSIBLE PANELS =====
    document.querySelectorAll('.panel-header').forEach(header => {
      header.addEventListener('click', () => {
        const panel = header.closest('.panel');
        panel.classList.toggle('collapsed');
      });
    });

    // ===== DRAW MODE =====
    const drawToggle = document.getElementById('drawToggle');
    const drawOverlay = document.getElementById('drawOverlay');
    const drawToolbar = document.getElementById('drawToolbar');
    const drawModeBadge = document.getElementById('drawModeBadge');
    const drawClose = document.getElementById('drawClose');
    let drawMode = false;

    function toggleDrawMode(force) {
      drawMode = force !== undefined ? force : !drawMode;
      drawOverlay.classList.toggle('active', drawMode);
      drawToolbar.classList.toggle('active', drawMode);
      drawModeBadge.classList.toggle('active', drawMode);
      drawToggle.classList.toggle('bg-mag-glow/20', drawMode);
      drawToggle.classList.toggle('border-mag-glow', drawMode);

      if (drawMode) {
        resizeDrawCanvas();
        drawModeBadge.classList.add('active');
        setTimeout(() => drawModeBadge.classList.remove('active'), 3000);
      }
    }

    drawToggle.addEventListener('click', () => toggleDrawMode());
    drawClose.addEventListener('click', () => toggleDrawMode(false));

    // Draw canvas
    const drawCtx = drawOverlay.getContext('2d');
    let drawing = false;
    let drawColor = '#00ffff';
    let brushSizeVal = 3;
    let drawLastX = 0;
    let drawLastY = 0;

    function resizeDrawCanvas() {
      const dpr = window.devicePixelRatio || 1;
      // Save current drawing
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = drawOverlay.width;
      tempCanvas.height = drawOverlay.height;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(drawOverlay, 0, 0);

      drawOverlay.width = window.innerWidth * dpr;
      drawOverlay.height = window.innerHeight * dpr;
      drawOverlay.style.width = window.innerWidth + 'px';
      drawOverlay.style.height = window.innerHeight + 'px';
      drawCtx.scale(dpr, dpr);

      // Restore
      drawCtx.setTransform(1, 0, 0, 1, 0, 0);
      drawCtx.drawImage(tempCanvas, 0, 0, tempCanvas.width, tempCanvas.height, 0, 0, drawOverlay.width, drawOverlay.height);
      const dpr2 = window.devicePixelRatio || 1;
      drawCtx.setTransform(dpr2, 0, 0, dpr2, 0, 0);
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
    }

    window.addEventListener('resize', () => {
      if (drawMode) resizeDrawCanvas();
    });

    function getDrawPos(e) {
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      return { x, y };
    }

    function startDraw(e) {
      if (!drawMode) return;
      e.preventDefault();
      drawing = true;
      const pos = getDrawPos(e);
      drawLastX = pos.x;
      drawLastY = pos.y;
    }

    function doDraw(e) {
      if (!drawing || !drawMode) return;
      e.preventDefault();
      const pos = getDrawPos(e);
      drawCtx.beginPath();
      drawCtx.strokeStyle = drawColor;
      drawCtx.lineWidth = brushSizeVal;
      drawCtx.shadowBlur = brushSizeVal * 3;
      drawCtx.shadowColor = drawColor;
      drawCtx.moveTo(drawLastX, drawLastY);
      drawCtx.lineTo(pos.x, pos.y);
      drawCtx.stroke();
      drawCtx.shadowBlur = 0;
      drawLastX = pos.x;
      drawLastY = pos.y;
    }

    function stopDraw(e) {
      if (e) e.preventDefault();
      drawing = false;
    }

    drawOverlay.addEventListener('mousedown', startDraw);
    drawOverlay.addEventListener('mousemove', doDraw);
    drawOverlay.addEventListener('mouseup', stopDraw);
    drawOverlay.addEventListener('mouseleave', stopDraw);
    drawOverlay.addEventListener('touchstart', startDraw, { passive: false });
    drawOverlay.addEventListener('touchmove', doDraw, { passive: false });
    drawOverlay.addEventListener('touchend', stopDraw);

    // Color swatches
    document.querySelectorAll('.color-swatch').forEach(swatch => {
      swatch.addEventListener('click', () => {
        drawColor = swatch.dataset.color;
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
      });
    });

    // Brush size
    document.getElementById('brushSize').addEventListener('input', (e) => {
      brushSizeVal = parseInt(e.target.value);
    });

    // Clear
    document.getElementById('clearCanvas').addEventListener('click', () => {
      const dpr = window.devicePixelRatio || 1;
      drawCtx.clearRect(0, 0, drawOverlay.width / dpr, drawOverlay.height / dpr);
    });

    // ===== MODALS =====
    const copyrightBtn = document.getElementById('copyrightBtn');
    const privacyBtn = document.getElementById('privacyBtn');
    const copyrightModal = document.getElementById('copyrightModal');
    const privacyModal = document.getElementById('privacyModal');

    copyrightBtn.addEventListener('click', () => {
      copyrightModal.classList.add('active');
      document.body.style.overflow = 'hidden';
    });
    privacyBtn.addEventListener('click', () => {
      privacyModal.classList.add('active');
      document.body.style.overflow = 'hidden';
    });

    const returnBtn = document.getElementById('returnBtn');
    const returnModal = document.getElementById('returnModal');
    returnBtn.addEventListener('click', () => {
      returnModal.classList.add('active');
      document.body.style.overflow = 'hidden';
    });

    document.querySelectorAll('.modal-close').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.closest('.modal-overlay').classList.remove('active');
        document.body.style.overflow = '';
      });
    });

    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) {
          overlay.classList.remove('active');
          document.body.style.overflow = '';
        }
      });
    });

    // ===== MOBILE MENU =====
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    mobileMenuBtn.addEventListener('click', () => {
      sidebarOpen = !sidebarOpen;
      updateSidebar();
    });

    // ===== CURSOR GLOW (DESKTOP) =====
    if (window.matchMedia('(pointer: fine)').matches) {
      const cursorGlow = document.createElement('div');
      cursorGlow.style.cssText = `
        position:fixed;width:150px;height:150px;border-radius:50%;
        background:radial-gradient(circle,rgba(0,255,255,0.04) 0%,transparent 70%);
        pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:opacity 0.3s;
      `;
      document.body.appendChild(cursorGlow);
      document.addEventListener('mousemove', (e) => {
        cursorGlow.style.left = e.clientX + 'px';
        cursorGlow.style.top = e.clientY + 'px';
      });
    }

    // Keyboard shortcut: D for draw, Escape to exit
    document.addEventListener('keydown', (e) => {
      if (e.key === 'd' || e.key === 'D') {
        if (!e.target.closest('input, textarea')) toggleDrawMode();
      }
      if (e.key === 'Escape') {
        if (drawMode) toggleDrawMode(false);
        document.querySelectorAll('.modal-overlay.active').forEach(m => {
          m.classList.remove('active');
          document.body.style.overflow = '';
        });
      }
    });
  </script>
</body>
</html>
